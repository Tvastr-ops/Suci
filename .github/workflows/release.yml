name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (leave empty to auto-extract from pubspec.yaml)'
        required: false
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Release Version Automatically
        id: vars
        run: |
          # 1. Check if manually provided
          INPUT_TAG="${{ github.event.inputs.tag_name }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            # 2. Extract version from pubspec.yaml (e.g. 1.0.0+1 -> v1.0.0)
            PUBSPEC_VER=$(grep '^version:' pubspec.yaml | head -n1 | cut -d':' -f2 | tr -d ' ' | cut -d'+' -f1)
            TAG="v${PUBSPEC_VER}"
          fi

          echo "Calculated release tag: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "clean_version=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify static analysis
        run: flutter analyze

      - name: Run automated tests
        run: flutter test

      - name: Decode Android Keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks

      - name: Build Universal APK
        run: |
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/suci-${{ steps.vars.outputs.tag }}-universal.apk"

      - name: Build ARM64 Standalone APK
        run: |
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/suci-${{ steps.vars.outputs.tag }}-arm64-v8a.apk"

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum suci-*.apk > checksums.sha256
          echo "Generated Checksums:"
          cat checksums.sha256
          ls -la

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Suci ${{ steps.vars.outputs.tag }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          body: |
            ### Downloads
            - **`suci-${{ steps.vars.outputs.tag }}-arm64-v8a.apk`** (Recommended): Modern 64-bit build with smaller size and optimal performance for almost all phones.
            - **`suci-${{ steps.vars.outputs.tag }}-universal.apk`**: All-in-one build compatible with all Android devices.
            - **`checksums.sha256`**: SHA-256 verification hashes for file integrity.
          files: |
            dist/suci-*-arm64-v8a.apk
            dist/suci-*-universal.apk
            dist/checksums.sha256
